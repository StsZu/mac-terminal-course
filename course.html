<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mac Terminal Course — Уроки</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #1e1e1e; --panel: #2d2d2d; --border: #3d3d3d;
      --text: #f5f5f7; --muted: #98989d; --cyan: #64d2ff; --green: #30d158;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; }
    .wrap { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    @media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } aside { border-right: none !important; border-bottom: 1px solid var(--border); } }
    aside { background: var(--panel); border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; }
    main { padding: 24px 32px; overflow-y: auto; max-width: 820px; }
    .top-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .top-nav a { color: var(--muted); text-decoration: none; font-size: 0.85rem; padding: 5px 10px; border-radius: 6px; }
    .top-nav a:hover { color: var(--text); background: #3a3a3c; }
    .top-nav a.active { color: var(--cyan); }
    h1.side { font-size: 1rem; margin: 0 0 12px; }
    .lesson-link {
      display: block; padding: 8px 10px; border-radius: 8px; color: var(--text);
      text-decoration: none; font-size: 0.85rem; margin-bottom: 4px; border: 1px solid transparent;
    }
    .lesson-link:hover { background: #3a3a3c; }
    .lesson-link.active { border-color: var(--cyan); color: var(--cyan); background: rgba(100,210,255,0.08); }
    #content { line-height: 1.65; font-size: 0.95rem; }
    #content h1 { font-size: 1.5rem; margin-top: 0; }
    #content h2 { font-size: 1.15rem; color: var(--cyan); margin-top: 1.5em; }
    #content h3 { font-size: 1rem; }
    #content code { background: #3a3a3c; padding: 2px 6px; border-radius: 4px; font-size: 0.88em; }
    #content pre { background: #252525; border: 1px solid var(--border); border-radius: 8px; padding: 14px; overflow-x: auto; }
    #content pre code { background: none; padding: 0; }
    #content table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.9rem; }
    #content th, #content td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    #content th { background: #3a3a3c; }
    #content blockquote { border-left: 3px solid var(--cyan); margin: 1em 0; padding-left: 1em; color: var(--muted); }
    #loading { color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <aside>
      <nav class="top-nav">
        <a href="index.html">Тренажер</a>
        <a href="course.html" class="active">Уроки</a>
        <a href="cheatsheet.html">Шпаргалка</a>
      </nav>
      <h1 class="side">Уроки курсу</h1>
      <a class="lesson-link active" href="#" data-file="mac-terminal-course/README.md">Огляд курсу</a>
      <a class="lesson-link" href="#" data-file="mac-terminal-course/01-terminal-basics.md">1. Terminal basics</a>
      <a class="lesson-link" href="#" data-file="mac-terminal-course/02-files-and-folders.md">2. Файли та папки</a>
      <a class="lesson-link" href="#" data-file="mac-terminal-course/03-search-and-text.md">3. Пошук і текст</a>
      <a class="lesson-link" href="#" data-file="mac-terminal-course/04-network-diagnostics.md">4. Мережа</a>
      <a class="lesson-link" href="#" data-file="mac-terminal-course/05-ssh-and-mikrotik.md">5. SSH / MikroTik</a>
      <a class="lesson-link" href="#" data-file="mac-terminal-course/06-git-and-github.md">6. Git / GitHub</a>
      <a class="lesson-link" href="#" data-file="mac-terminal-course/07-python-node-homebrew.md">7. Python / Node / brew</a>
      <a class="lesson-link" href="#" data-file="mac-terminal-course/08-ai-cli-agents.md">8. AI CLI</a>
      <a class="lesson-link" href="#" data-file="mac-terminal-course/09-dangerous-commands.md">9. Небезпечні команди</a>
      <a class="lesson-link" href="#" data-file="mac-terminal-course/10-daily-practice-plan.md">10. 14-денний план</a>
    </aside>
    <main>
      <div id="loading">Завантаження…</div>
      <article id="content"></article>
    </main>
  </div>
  <script>
    const links = document.querySelectorAll(".lesson-link");
    const content = document.getElementById("content");
    const loading = document.getElementById("loading");

    async function loadLesson(file) {
      loading.style.display = "block";
      content.innerHTML = "";
      try {
        const res = await fetch(file);
        if (!res.ok) throw new Error(res.statusText);
        const md = await res.text();
        content.innerHTML = marked.parse(md);
        loading.style.display = "none";
        history.replaceState(null, "", `?lesson=${encodeURIComponent(file)}`);
      } catch (e) {
        loading.textContent = "Помилка завантаження: " + e.message;
      }
    }

    links.forEach(link => {
      link.addEventListener("click", e => {
        e.preventDefault();
        links.forEach(l => l.classList.remove("active"));
        link.classList.add("active");
        loadLesson(link.dataset.file);
      });
    });

    const params = new URLSearchParams(location.search);
    const initial = params.get("lesson") || "mac-terminal-course/README.md";
    const initLink = [...links].find(l => l.dataset.file === initial) || links[0];
    initLink.classList.add("active");
    [...links].forEach(l => { if (l !== initLink) l.classList.remove("active"); });
    loadLesson(initLink.dataset.file);
  </script>
</body>
</html>
